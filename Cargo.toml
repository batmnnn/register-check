[workspace]
members = ["crates/*", "programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/batmnnn/register-check"

[workspace.dependencies]
# DataFusion 54 is the newest release whose MSRV (1.88) builds on rustc 1.93; arrow must match its arrow (58).
datafusion = { version = "54.1", default-features = false, features = ["sql", "datetime_expressions", "recursive_protection"] }
arrow = { version = "58.3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
# rc-ingest talks raw JSON-RPC (SPEC D1); rustls keeps OpenSSL out of the build.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
async-trait = "0.1"
ed25519-dalek = "2"
bs58 = "0.5"
rc-types = { path = "crates/rc-types" }
rc-engine = { path = "crates/rc-engine" }
rc-ingest = { path = "crates/rc-ingest" }
rc-proof = { path = "crates/rc-proof" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Disk is tight on the build box: keep line tables for our crates, no debuginfo for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
