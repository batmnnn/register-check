[package]
name = "rc-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Register Check command line: check, sign-reserve, watch"

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
rc-types.workspace = true
rc-engine.workspace = true
rc-ingest.workspace = true
rc-proof.workspace = true
clap = { version = "4.6", features = ["derive"] }
tokio = { workspace = true, features = ["time", "signal"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek.workspace = true
bs58.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile = "3"
