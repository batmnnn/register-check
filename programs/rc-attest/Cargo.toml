[package]
name = "rc-attest"
version = "0.1.0"
description = "Register Check on-chain attestation: rule SQL hashes and check result hashes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "rc_attest"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"

[dev-dependencies]
# litesvm 0.18 runs the Agave 4.3 runtime, which loads sBPFv3 (0.10 from the Anchor scaffold can't).
litesvm = "0.18.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
